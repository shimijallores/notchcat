name: Release

# Builds an unsigned NotchCat.dmg and attaches it to a GitHub Release
# whenever a tag like v1.0.0 is pushed. Also runnable by hand from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotchCat-dmg
          path: build/NotchCat.dmg

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NotchCat.dmg
          body: |
            Unsigned build. On first launch macOS will block it.

            1. Open NotchCat once from Applications and dismiss the warning.
            2. System Settings → Privacy & Security → **Open Anyway**.

            Or in Terminal: `xattr -dr com.apple.quarantine /Applications/NotchCat.app`
